<!DOCTYPE html>
<html lang="es">
<head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/fold/brace-fold.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/php/php.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/css/css.min.js"></script>

    <!-- Firebase - Solo Firestore y Auth -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- Font Awesome - Solo iconos esenciales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" href="assets/logowar.png" type="image/x-icon">
    <!-- Estilos -->
    <link rel="stylesheet" href="styles/anthon-code.css">
</head>
<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->
    <header id="main-header">
        <div class="header-left">
            <div class="logo-container">
                <img src="assets/logowar.png" alt="Anthon Code Logo" class="app-logo">
                <h1 class="app-title">Hydra Studio Code</h1>
            </div>
        </div>

        <!-- BARRA DE BÚSQUEDA -->
        <div class="header-search">
            <i class="fas fa-search header-search-icon"></i>
            <input type="text" id="search-input" placeholder="Buscar scripts..." />
        </div>

        <div class="header-actions">
            <button id="add-script-link" class="icon-btn filter-btn">
                <i class="fas fa-folder-plus"></i>
                <span id="add-btn-text">Agregar Carpeta</span>
            </button>
            <a href="https://github.com/hydrastudiocode/Anthon-Code" target="_blank" class="icon-btn github-btn">
                <i class="fab fa-github"></i>
                <span>GitHub</span>
            </a>
            <button class="icon-btn logout-action-btn" id="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                <span>Salir</span>
            </button>
        </div>
    </header>

    <!-- =====================================================
         LAYOUT: SIDEBAR + MAIN
         ===================================================== -->
    <div class="page-layout">

        <!-- SIDEBAR IZQUIERDO -->
    <!-- SIDEBAR IZQUIERDO - VERSIÓN MODIFICADA -->
<aside class="sidebar">
    <div class="sidebar-section">
        <span class="sidebar-label">Navegacion</span>
        <a href="#" id="view-scripts-link" class="sidebar-link active">
            <i class="fas fa-th-large"></i>
            Ver Scripts
        </a>
    </div>

    <!-- ========== NUEVO: SECCIÓN DE CARPETA ACTUAL ========== -->
  <!-- SIDEBAR - Navegación de carpeta -->
<!-- SIDEBAR - Navegación de carpeta -->
<div id="folder-nav-section" class="sidebar-section" style="display: none;">
    <span class="sidebar-label">Carpeta Actual</span>
    <div id="folder-nav-content">
        <button id="folder-back-btn-sidebar" class="sidebar-link" style="cursor: pointer;">
            <i class="fas fa-arrow-left"></i>
            Volver a carpetas
        </button>
        <div id="current-folder-display" class="sidebar-link" style="cursor: default; opacity: 0.8;">
            <i class="fas fa-folder" style="color: var(--accent-primary);"></i>
            <span id="current-folder-name">Sin carpeta</span>
        </div>
    
    </div>
</div>

<!-- ========== NUEVO: SECCIÓN DE BÚSQUEDA EN SIDEBAR ========== -->
<div id="search-nav-section" class="sidebar-section" style="display: none;">
    <span class="sidebar-label">Búsqueda</span>
    <div id="search-nav-content">
        <button id="search-back-btn-sidebar" class="sidebar-link" style="cursor: pointer;">
            <i class="fas fa-arrow-left"></i>
            Volver
        </button>
        <div id="current-search-display" class="sidebar-link" style="cursor: default; opacity: 0.8;">
            <i class="fas fa-search" style="color: var(--accent-primary);"></i>
            <span id="current-search-term">Buscando...</span>
        </div>
        <div id="search-results-count-sidebar" style="padding: 4px 12px; font-size: 0.75rem; color: var(--text-muted);">
            <span id="search-count-number">0</span> resultados
        </div>
     
    </div>
</div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-section">
        <span class="sidebar-label">Herramientas</span>
        <a href="https://github.com/hydrastudiocode/Anthon-Code-1.0.2" target="_blank" class="sidebar-link">
            <i class="fab fa-github"></i>
            GitHub
        </a>
        
        <button class="sidebar-link logout-action-btn" id="sidebar-logout-btn" style="cursor:pointer;">
            <i class="fas fa-sign-out-alt"></i>
            Cerrar sesion
        </button>
    </div>
</aside>

        <!-- CONTENIDO PRINCIPAL -->
    <main>
    <div id="scripts-section" class="container">
        <!-- Contenedor para carpetas -->
        <div class="folders-container" id="folders-container"></div>
        <!-- Contenedor para scripts -->
        <div class="scripts-container" id="scripts-container" style="display: none;"></div>
    </div>
</main>
    </div>

    <!-- =====================================================
         MODAL PARA VER SCRIPT
         ===================================================== -->
    <div id="script-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title" style="text-align: center; color: #ffffff;">Detalles del Script</h2>
            
            <div class="script-info">
                <p class="script-author" id="modal-author" style="text-align: center;"></p>
                <p class="script-notes" id="modal-notes" style="text-align: center; white-space: pre-line;"></p>
            </div>
            
            <div class="code-viewer">
                <div id="modal-editor-container" style="height: auto; border-radius: 8px;"></div>
            </div>
            
            <div class="modal-actions">
                <button id="copy-btn" class="copy-btn"><i class="fas fa-copy"></i> Copiar</button>
                <button id="clone-btn" class="copy-btn"><i class="fas fa-clone"></i> Clonar</button>
                <button id="edit-btn" class="edit-btn"><i class="fas fa-edit"></i> Editar</button>
                <button id="download-btn" class="copy-btn"><i class="fas fa-download"></i> Descargar</button>
                <button id="modal-delete-btn" class="delete-btn"><i class="fas fa-trash"></i> Eliminar</button>
            </div>
        </div>
    </div>

    <!-- =====================================================
         MODAL DE AGREGAR SCRIPT
         ===================================================== -->
    <div id="add-script-modal" class="modal">
        <div class="modal-content edit-modal-content">
            <span class="close add-close">&times;</span>
            
            <form id="add-script-form">
                <input type="hidden" id="add-script-id">
                <input type="hidden" id="add-script-folder">
                
                <div class="form-steps">
                    <div class="add-step-indicator active" data-step="1">   
                        <span class="step-label">Escribir Codigo</span>
                    </div>
                    <div class="add-step-indicator" data-step="2">
                        <span class="step-label">Información</span>
                    </div>
                </div>
                
                <!-- PASO 1: EDITOR DE CÓDIGO -->
                <div id="add-step-1" class="form-step active">
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <label for="add-script-content"><i class="fas fa-code"></i> Codigo:</label>
                            <button type="button" id="expand-add-editor-btn" class="btn-mini">
                                <i class="fas fa-expand"></i> Expandir
                            </button>
                        </div>
                        <div class="code-mirror-wrapper">
                            <textarea id="add-script-content" placeholder="Escribe Codigo..."></textarea>
                        </div>
                    </div>
                    <div class="step-buttons">
                        <button type="button" class="btn-next-step-add" data-next="2">
                            Siguiente <i class="fas fa-arrow-right"></i>
                        </button>
                        <button type="button" class="btn-cancel-add btn-secondary">Cancelar</button>
                    </div>
                </div>
                
                <!-- PASO 2: METADATOS -->
                <div id="add-step-2" class="form-step">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="add-script-title"><i class="fas fa-tag"></i> Nombre Script:</label>
                            <input type="text" id="add-script-title" required placeholder="Ej: MiScript">
                        </div>
                        <div class="form-group">
                            <label for="add-script-author"><i class="fas fa-user"></i> Autor:</label>
                            <input type="text" id="add-script-author" placeholder="Nombre del autor">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group custom-select2">
                            <label for="add-script-category"><i class="fas fa-code"></i> Lenguaje:</label>
                            <select id="add-script-category" required>
                                   <option value="">Selecciona un lenguaje</option>
                                <option value="C">C</option>
                                <option value="C#">C#</option>
                                <option value="C++">C++</option>
                                <option value="Python">Python</option>
                                <option value="PHP">PHP</option>
                                <option value="GdScript">Gd Script</option>
                                <option value="JavaScript">JavaScript</option>
                                <option value="FireBase">FireBase Conf</option>
                                <option value="HTML">HTML</option>
                                <option value="CSS">CSS</option>
                                <option value="GitHub">GitHub</option>
                                <option value="Git">Git</option>
                                <option value="Google">Google</option>
                                <option value="Microsoft">Microsoft</option>
                                <option value="Meta">Meta</option>
                                <option value="Spotify">Spotify</option>
                                <option value="Discord">Discord</option>
                                <option value="Slack">Slack</option>
                                <option value="Figma">Figma</option>
                                <option value="Stripe">Stripe</option>
                                <option value="Vercel">Vercel</option>
                                <option value="Docker">Docker</option>
                                <option value="React">React</option>
                                <option value="Next.js">Next.js</option>
                                <option value="TypeScript">TypeScript</option>
                                <option value="Rust">Rust</option>
                                <option value="Claude">Claude</option>
                                <option value="Supabase">Supabase</option>
                                <option value="PostgreSQL">PostgreSQL</option>
                                <option value="MongoDB">MongoDB</option>
                                <option value="Redis">Redis</option>
                                <option value="Linux">Linux</option>
                                <option value="AWS">AWS</option>
                                <option value="Cloudfare">Cloudfare</option>
                                <option value="Swift">Swift</option>
                                <option value="Android">Android</option>
                                <option value="AndroidStudio">Android Studio</option>
                                <option value="JSON">JSON</option>
                                <option value="DotEnv">DotEnv</option>
                                <option value="Apache">Apache</option>
                                <option value="Angular">Angular</option>
                                <option value="Astro">Astro</option>
                                <option value="Blitz">Blitz</option>
                                <option value="Bootstrap">Bootstrap</option>
                                <option value="Django">Django</option>
                                <option value="Net">.NET</option>
                                <option value="N8N">N8N</option>
                                <option value="FastApi">FastApi</option>
                                <option value="Flutter">Flutter</option>
                                <option value="Vue">Vue</option>
                                <option value="AssemblyScript">AssemblyScript</option>
                                <option value="Bash">Bash</option>
                                <option value="Css-New">CSS New</option>
                                <option value="Dart">Dart</option>
                                <option value="Java">Java</option>
                                <option value="Kotlin">Kotlin</option>
                                <option value="Ocaml">Ocaml</option>
                                <option value="Perl">Perl</option>
                                <option value="Powershell">Powershell</option>
                                <option value="Windows">Windows</option>
                                <option value="Ruby">Ruby</option>
                                <option value="SVG">SVG</option>
                                <option value="Cobol">Cobol</option>
                                <option value="Otro">Apuntes</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="add-script-notes"><i class="fas fa-sticky-note"></i> Observaciones:</label>
                        <textarea id="add-script-notes" placeholder="Notas del Codigo" rows="3"></textarea>
                    </div>
                    
                    <div class="step-buttons">
                        <button type="button" class="btn-prev-step-add" data-prev="1">
                            <i class="fas fa-arrow-left"></i> Anterior
                        </button>
                        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Guardar Script</button>
                        <button type="button" class="btn-cancel-add btn-secondary">Cancelar</button>
                    </div>
                </div>
                
                <p id="add-form-status"></p>
            </form>
        </div>
    </div>
